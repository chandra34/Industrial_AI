

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/db/metadata.db
    volumes:
      - shared_uploads:/app/backend/uploads
      - shared_db:/app/db

  worker:
    build: .
    command: python -m backend.worker
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/db/metadata.db
    volumes:
      - shared_uploads:/app/backend/uploads
      - shared_db:/app/db

volumes:
  redis_data:
  shared_uploads:
  shared_db:

